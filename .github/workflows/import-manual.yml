name: Import manual predictions

# Prediction LEADS committed under seed/manual/ (e.g. the daily Grok Bot
# file, or a hand-curated list). Each row is re-checked against its live
# source (X via the official API, or free oEmbed without a token; web pages
# fetched live), then the cascade verifier publishes or rejects it. Pushing a
# new or changed file to main imports it automatically. Safe to re-run.

on:
  push:
    branches: [main]
    paths: ["seed/manual/**.json"]
  workflow_dispatch:
    inputs:
      file:
        description: "JSON file(s) under seed/manual/ (space-separated)"
        required: true
      verify:
        description: "sync = verify now; batch = half price, published by the next daily ingestion"
        type: choice
        options: [batch, sync]
        default: batch

concurrency:
  group: import-manual
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
      SUBMISSION_HASH_SALT: ${{ secrets.SUBMISSION_HASH_SALT }}
      NEXT_PUBLIC_SITE_ORIGIN: ${{ secrets.NEXT_PUBLIC_SITE_ORIGIN }}
      CRON_SECRET: ${{ secrets.CRON_SECRET }}
      X_BEARER_TOKEN: ${{ secrets.X_BEARER_TOKEN }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      DAILY_BUDGET_USD: ${{ vars.DAILY_BUDGET_USD }}
      CASCADE_VERIFIER_MODEL: ${{ vars.CASCADE_VERIFIER_MODEL }}
      VERIFIER_API_KEY: ${{ secrets.VERIFIER_API_KEY }}
      VERIFIER_PUBLISH: ${{ vars.VERIFIER_PUBLISH }}
      VERIFIER_BASE_URL: ${{ vars.VERIFIER_BASE_URL }}
      VERIFIER_MODEL: ${{ vars.VERIFIER_MODEL }}
      VERIFIER_MIN_INTERVAL_MS: ${{ vars.VERIFIER_MIN_INTERVAL_MS }}
      VERIFIER_MAX_PER_RUN: ${{ vars.VERIFIER_MAX_PER_RUN }}
      X_PRICE_PER_POST_READ_USD: ${{ vars.X_PRICE_PER_POST_READ_USD }}
      OPENAI_PRICE_INPUT_PER_MTOK_USD: ${{ vars.OPENAI_PRICE_INPUT_PER_MTOK_USD }}
      OPENAI_PRICE_OUTPUT_PER_MTOK_USD: ${{ vars.OPENAI_PRICE_OUTPUT_PER_MTOK_USD }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Import and verify
        env:
          IN_FILE: ${{ inputs.file }}
          VERIFY: ${{ inputs.verify || 'batch' }}
          BEFORE: ${{ github.event.before }}
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            IN_FILE=$(git diff --name-only --diff-filter=AM "$BEFORE" HEAD -- 'seed/manual/*.json' 2>/dev/null || git diff --name-only --diff-filter=AM HEAD~1 HEAD -- 'seed/manual/*.json')
          fi
          if [ -z "$IN_FILE" ]; then echo "No new or changed lead files."; exit 0; fi
          for f in $IN_FILE; do
            case "$f" in seed/manual/*.json) ;; *) echo "Only seed/manual/*.json files are allowed: $f"; exit 1 ;; esac
          done
          if [ "$VERIFY" = "sync" ]; then pnpm import:manual $IN_FILE; else pnpm import:manual $IN_FILE --batch; fi
      - name: Tell Slack the run failed
        if: failure() && env.SLACK_WEBHOOK_URL != ''
        run: |
          curl -sS -X POST -H 'Content-Type: application/json' \
            --data "{\"text\":\"❌ PublicLedger: ${{ github.workflow }} failed. ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\"}" \
            "$SLACK_WEBHOOK_URL" || true

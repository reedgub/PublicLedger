name: Resolve due predictions (daily)

# Sweeps predictions whose resolution_date has passed and moves them from
# "open" into "resolved" (correct/incorrect/partial/ambiguous/void) via the
# OpenAI proposer + verifier pipeline. Auto-approves rows that clear the
# confidence and evidence thresholds; the rest are marked
# resolution_pending for admin review.

on:
  # Every day at 13:00 UTC, an hour after the ingestion cron so newly
  # inserted predictions with past deadlines get swept in the same day.
  schedule:
    - cron: "0 13 * * *"
  workflow_dispatch: {}

concurrency:
  group: resolve-due
  cancel-in-progress: false

jobs:
  resolve:
    runs-on: ubuntu-latest
    # Each OpenAI proposer + verifier call can take up to 60s × 5 retries.
    # With concurrency=2 and a 15-prediction sweep, the first run hit the old
    # 20-minute cap. 45 gives headroom for occasional deep-research stragglers
    # without letting a wedged run linger forever.
    timeout-minutes: 45
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
      CRON_SECRET: ${{ secrets.CRON_SECRET }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OPENAI_MODEL: ${{ secrets.OPENAI_MODEL }}
      OPENAI_VERIFIER_MODEL: ${{ secrets.OPENAI_VERIFIER_MODEL }}
      SUBMISSION_HASH_SALT: ${{ secrets.SUBMISSION_HASH_SALT }}
      NEXT_PUBLIC_SITE_ORIGIN: ${{ secrets.NEXT_PUBLIC_SITE_ORIGIN }}
      RESOLUTION_DAILY_BUDGET_USD: ${{ vars.RESOLUTION_DAILY_BUDGET_USD }}
      RESOLUTION_MAX_PER_RUN: ${{ vars.RESOLUTION_MAX_PER_RUN }}
      OPENAI_PRICE_INPUT_PER_MTOK_USD: ${{ vars.OPENAI_PRICE_INPUT_PER_MTOK_USD }}
      OPENAI_PRICE_OUTPUT_PER_MTOK_USD: ${{ vars.OPENAI_PRICE_OUTPUT_PER_MTOK_USD }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Resolve due predictions
        run: pnpm seed:resolve
      - name: Tell Slack the run failed
        if: failure() && env.SLACK_WEBHOOK_URL != ''
        run: |
          curl -sS -X POST -H 'Content-Type: application/json' \
            --data "{\"text\":\"❌ PublicLedger: ${{ github.workflow }} failed. ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\"}" \
            "$SLACK_WEBHOOK_URL" || true
